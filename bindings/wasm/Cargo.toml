[package]
name = "shields-wasm"
version = "1.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jannchie <jannchie@gmail.com>"]
description = "WebAssembly bindings for the shields badge rendering engine"
license = "MIT"
repository = "https://github.com/Jannchie/shields.rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Reuse the core engine unchanged.
shields = { path = "../..", default-features = false }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[features]
# On by default so named logos (logo: "rust") work out of the box. This embeds
# the ~3000-icon Simple Icons set, which dominates the .wasm size. Build with
# --no-default-features for a slim build that only accepts custom SVG logos.
default = ["simple-icons"]
simple-icons = ["shields/simple-icons"]

# Smaller panic handling / no unwinding tables in the wasm binary.
# opt-level=2 over "s": the .wasm size is dominated by the embedded icon data,
# not render code, so "s" saved ~1.5% of bytes while costing ~13% render
# throughput. Optimize the hot path for speed instead. (Measured via bench.mjs.)
[profile.release]
opt-level = 2
lto = true
