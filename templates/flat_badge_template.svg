{% let has_label = !label.is_empty() %}
{% let has_message = !message.is_empty() %}
{% let has_one_link = !link.is_empty() && extra_link.is_empty() %}
{% let has_two_link = !link.is_empty() && !extra_link.is_empty() %}
{% let has_logo = !logo.is_empty() %}
<svg xmlns="http://www.w3.org/2000/svg" width="{{ total_width|safe }}" height="{{ badge_height|safe }}"{% if !has_two_link %} role="img" aria-label="{{ accessible_text }}"{% endif %}>
    {% if !has_two_link %}
    <title>{{ accessible_text }}</title>
    {% endif %}
    {% if has_one_link %}
    <a target="_blank" href="{{ link }}">
    {% endif %}
    <filter id="blur">
        <feGaussianBlur stdDeviation="16" />
    </filter>
    <linearGradient id="s{{ id_suffix }}" x2="0" y2="100%">
        <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
        <stop offset="1" stop-opacity=".1" />
    </linearGradient>
    <clipPath id="r{{ id_suffix }}">
        <rect width="{{ total_width|safe }}" height="{{ badge_height|safe }}" rx="3" />
    </clipPath>
    <g clip-path="url(#r{{ id_suffix }})">
        <rect width="{{ left_width|safe }}" height="{{ badge_height|safe }}" fill="{{ label_color }}" />
        <rect x="{{ left_width|safe }}" width="{{ right_width|safe }}" height="{{ badge_height|safe }}" fill="{{ message_color }}" />
        <rect width="{{ total_width|safe }}" height="{{ badge_height|safe }}" fill="url(#s{{ id_suffix }})" />
    </g>
    <g fill="#fff" text-anchor="middle" font-family="{{ font_family }}" text-rendering="geometricPrecision" font-size="{{ font_size_scaled|safe }}">

    {% if has_logo %}
    <image x="5" y="3" width="{{ logo_width|safe }}" height="14" href="{{ logo|safe }}" />
    {% endif %}

    {% if has_label %}
    {% if has_two_link %}<a target="_blank" href="{{ link }}"> <rect width="{{ left_width|safe }}" x="{{ rect_offset|safe }}" height="20" fill="rgba(0,0,0,0)"/>{% endif %}
    <g transform="scale(.1)">
        <g aria-hidden="true" fill="{{ label_shadow_color }}">
            <text x="{{ label_x|safe }}" y="150" fill-opacity=".8" filter="url(#blur)" textLength="{{ label_width_scaled|safe }}">{{ label }}</text>
            <text x="{{ label_x|safe }}" y="150" fill-opacity=".3" textLength="{{ label_width_scaled|safe }}">{{ label }}</text>
        </g>
        <text x="{{ label_x|safe }}" y="140" textLength="{{ label_width_scaled|safe }}"{% if label_text_color != "#fff" %} fill="{{ label_text_color }}"{% endif %}>{{ label }}</text>
    </g>
    {% if has_two_link %}</a>{% endif %}
    {% endif %}

    {% if has_message %}
    {% if has_two_link %}<a target="_blank" href="{{ extra_link }}"> <rect width="{{ right_width|safe }}" x="{{ message_link_x|safe }}" height="20" fill="rgba(0,0,0,0)"/>{% endif %}
    <g transform="scale(.1)">
        <g aria-hidden="true" fill="{{ message_shadow_color }}">
            <text x="{{ message_x|safe }}" y="150" fill-opacity=".8" filter="url(#blur)" textLength="{{ message_width_scaled|safe }}">{{ message }}</text>
            <text x="{{ message_x|safe }}" y="150" fill-opacity=".3" textLength="{{ message_width_scaled|safe }}">{{ message }}</text>
        </g>
        <text x="{{ message_x|safe }}" y="140" textLength="{{ message_width_scaled|safe }}"{% if message_text_color != "#fff" %} fill="{{ message_text_color }}"{% endif %}>{{ message }}</text>
    </g>
    {% if has_two_link %}</a>{% endif %}
    {% endif %}</g>{% if has_one_link %}</a>{% endif %}
</svg>
