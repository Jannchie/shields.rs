name: Publish WASM to npm

# Publishes shields-wasm on every release tag, matching release.yml.
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. See the one-time
# bootstrap in bindings/wasm/README.md before the first tokenless run works.
#
# The publish step deliberately uses the npm CLI, not pnpm: pnpm's OIDC trusted-
# publishing support is currently broken (404 on pnpm 11, pnpm#11513). This job
# installs no project dependencies, so there is no pnpm disk saving to gain here
# anyway. Use pnpm for local installs/scripts (see the README).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10, which predates Trusted Publishing. Trusted
      # Publishing and --provenance via OIDC require npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Build package
        run: wasm-pack build bindings/wasm --target nodejs --release

      # npm rejects republishing an existing version, and the crate's Cargo.toml
      # version is not bumped per release. Stamp the package with the tag instead
      # so the npm version always tracks the GitHub release.
      - name: Sync version to tag
        if: github.ref_type == 'tag'
        working-directory: bindings/wasm/pkg
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: bindings/wasm/pkg
        run: npm publish --provenance --access public
