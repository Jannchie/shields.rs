name: Publish WASM to npm

# Publishes shields-wasm on every release tag, matching release.yml. Auth is npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret. See the one-time bootstrap in
# bindings/wasm/README.md before the first tokenless run works.
#
# The publish step uses the npm CLI, not pnpm — see the README's Publishing
# section for why.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10, which predates Trusted Publishing. Trusted
      # Publishing and --provenance via OIDC require npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Fail in seconds — before the multi-minute wasm build — if this version is
      # already on npm (a re-run of a tag, or a tag whose version was not bumped).
      # Check the output, not the exit code: `npm view pkg@newversion` prints
      # nothing and exits 0 for an unpublished version of an existing package.
      - name: Skip if already published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "$(npm view "shields-wasm@$version" version 2>/dev/null || true)" ]; then
            echo "::error::shields-wasm@$version is already on npm — bump the version and re-tag."
            exit 1
          fi
          echo "shields-wasm@$version not yet published — proceeding."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build package
        run: wasm-pack build bindings/wasm --target nodejs --release

      # The crate version in Cargo.toml is only a local-dev default; the git tag
      # is the source of truth for the published version, stamped here so the npm
      # release always matches the tag regardless of the crate version.
      - name: Stamp version from tag
        working-directory: bindings/wasm/pkg
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: bindings/wasm/pkg
        run: npm publish --provenance --access public
