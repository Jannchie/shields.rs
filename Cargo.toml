[package]
name = "shields"
version = "1.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jannchie <jannchie@gmail.com>"]
description = "High-performance Rust badge rendering engine, compatible with shields.io"
license = "MIT"
repository = "https://github.com/Jannchie/shields.rs"
keywords = ["badge", "SVG", "renderer", "font", "Rust"]
categories = ["graphics", "rendering", "web-programming"]
include = ["assets/**", "templates/**", "src/**", "build.rs", "Cargo.toml", "README.md"]
homepage = "https://github.com/Jannchie/shields.rs"
documentation = "https://docs.rs/shields"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

askama = "0.16.0"
base64 = "0.22.1"
simpleicons = { version = "0.3.0", optional = true }
csscolorparser = "0.8.3"

[features]
default = ["simple-icons"]
# Embeds the Simple Icons set (~3000 icons) for named logos like logo("rust").
# Disable to shrink compile time and binary size when only custom SVG logos
# (or no logos) are used.
simple-icons = ["dep:simpleicons"]

[build-dependencies]
serde_json = "1.0.141"

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }
urlencoding = "2.1.3"
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.2"
pretty_assertions = "1.4.1"
md5 = "0.8.0"

[[bench]]
name = "flat"
harness = false
